[project]
name = "go-pack-see-telegram-bot"
version = "0.1.0"
description = "Telegram bot for Go-Pack-See"
readme = "README.md"
authors = [
    { name = "Alexey Pisanenko", email = "pisanenko.alexey@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiogram>=3.31.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true

